<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flat Plant Notifications</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: white; border-radius: 16px; padding: 2.5rem;
      max-width: 400px; width: 100%; margin: 1rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08); text-align: center;
    }
    .emoji { font-size: 3.5rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; color: #1a1a1a; margin-bottom: 0.5rem; }
    .subtitle { color: #666; margin-bottom: 1.5rem; line-height: 1.5; }
    input {
      width: 100%; padding: 0.75rem 1rem; border: 1.5px solid #ddd;
      border-radius: 8px; font-size: 1rem; margin-bottom: 1rem; outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #2d6a2d; }
    button {
      width: 100%; padding: 0.85rem; background: #2d6a2d; color: white;
      border: none; border-radius: 8px; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    button:hover:not(:disabled) { background: #245424; }
    button:disabled { background: #999; cursor: not-allowed; }
    #status {
      margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 8px;
      font-size: 0.9rem; display: none; text-align: left;
    }
    #status.success { background: #e8f5e9; color: #2d6a2d; display: block; }
    #status.error { background: #ffebee; color: #c62828; display: block; }
    .plant-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.65rem 0; border-bottom: 1px solid #eee; text-align: left;
    }
    .plant-row:last-child { border-bottom: none; }
    .plant-name { font-weight: 600; color: #1a1a1a; }
    .plant-room { font-size: 0.78rem; color: #888; }
    .badge {
      font-size: 0.72rem; font-weight: 600; padding: 0.25rem 0.55rem;
      border-radius: 6px; white-space: nowrap; margin-left: 0.75rem;
    }
    .badge.needs-water { background: #ffebee; color: #c62828; }
    .badge.ok { background: #e8f5e9; color: #2d6a2d; }
    .plant-empty { text-align: left; color: #888; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">&#x1f33f;</div>
    <h1>Plant Notifications</h1>
    <p class="subtitle">Get notified when plants are watered or need watering. No app required.</p>
    <p id="checking" class="subtitle">Checking subscription status…</p>

    <div id="subscribeForm" style="display:none">
      <input type="text" id="label" placeholder="Your name (e.g. Jake's iPhone)" maxlength="60" />
      <button id="btn" onclick="subscribe()">Enable Notifications</button>
    </div>

    <div id="status"></div>

    <div id="plantDashboard" style="display:none">
      <div id="plantList"></div>
    </div>
  </div>

  <script>
    (function setupPullToRefresh() {
      const isStandalone = window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches;
      if (!isStandalone) return; // regular browser tabs already have native pull-to-refresh

      const THRESHOLD = 70;
      let startY = null;

      document.addEventListener('touchstart', (e) => {
        startY = window.scrollY === 0 ? e.touches[0].clientY : null;
      }, { passive: true });

      document.addEventListener('touchmove', (e) => {
        if (startY === null) return;
        if (e.touches[0].clientY - startY > THRESHOLD) {
          startY = null;
          location.reload();
        }
      }, { passive: true });

      document.addEventListener('touchend', () => {
        startY = null;
      }, { passive: true });
    })();

    async function getExistingSubscription() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return null;
      const reg = await navigator.serviceWorker.getRegistration('/');
      if (!reg) return null;
      return reg.pushManager.getSubscription();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function formatDuration(days) {
      const totalHours = Math.round(days * 24);
      const wholeDays = Math.floor(totalHours / 24);
      const hours = totalHours % 24;
      const parts = [];
      if (wholeDays > 0) parts.push(`${wholeDays} day${wholeDays === 1 ? '' : 's'}`);
      if (hours > 0 || parts.length === 0) parts.push(`${hours} hour${hours === 1 ? '' : 's'}`);
      return parts.join(', ');
    }

    function plantStatus(plant) {
      if (!plant.last_watered) {
        return { needsWater: true, label: 'Never watered' };
      }
      const daysSince = (Date.now() - new Date(plant.last_watered).getTime()) / 86400000;
      const overdueBy = daysSince - plant.watering_interval_days;
      if (overdueBy > 0) {
        return { needsWater: true, label: `Overdue ${formatDuration(overdueBy)}` };
      }
      return { needsWater: false, label: `OK · due in ${formatDuration(Math.abs(overdueBy))}` };
    }

    async function renderPlantDashboard() {
      const listEl = document.getElementById('plantList');
      document.getElementById('plantDashboard').style.display = 'block';
      try {
        const resp = await fetch('/plants');
        if (!resp.ok) throw new Error('Could not load plants.');
        const plants = await resp.json();

        if (!plants.length) {
          listEl.innerHTML = '<p class="plant-empty">No plants added yet.</p>';
          return;
        }

        const withStatus = plants.map(p => ({ plant: p, status: plantStatus(p) }));
        withStatus.sort((a, b) => Number(b.status.needsWater) - Number(a.status.needsWater));

        listEl.innerHTML = withStatus.map(({ plant, status }) => `
          <div class="plant-row">
            <div>
              <div class="plant-name">${escapeHtml(plant.name)}</div>
              <div class="plant-room">${escapeHtml(plant.room)}</div>
            </div>
            <span class="badge ${status.needsWater ? 'needs-water' : 'ok'}">${status.label}</span>
          </div>
        `).join('');
      } catch (err) {
        listEl.innerHTML = `<p class="plant-empty">${escapeHtml(err.message)}</p>`;
      }
    }

    function showSubscribedState() {
      document.getElementById('checking').style.display = 'none';
      document.getElementById('subscribeForm').style.display = 'none';
      renderPlantDashboard();
    }

    (async function init() {
      const existing = await getExistingSubscription().catch(() => null);
      if (existing) {
        // Re-send in the background in case the server dropped this subscription
        // (e.g. after a failed push) while the browser still holds it.
        const sub = existing.toJSON();
        fetch('/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ endpoint: sub.endpoint, p256dh: sub.keys.p256dh, auth: sub.keys.auth, label: '' }),
        }).catch(() => {});
        showSubscribedState();
      } else {
        document.getElementById('checking').style.display = 'none';
        document.getElementById('subscribeForm').style.display = 'block';
      }
    })();

    async function subscribe() {
      const btn = document.getElementById('btn');
      const statusEl = document.getElementById('status');
      const label = document.getElementById('label').value.trim();

      btn.disabled = true;
      btn.textContent = 'Connecting…';
      statusEl.className = '';
      statusEl.style.display = 'none';

      try {
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
          throw new Error('Push notifications are not supported in this browser.');
        }

        // Register service worker
        const reg = await navigator.serviceWorker.register('/sw.js', { scope: '/' });
        await navigator.serviceWorker.ready;

        // Fetch VAPID public key
        const keyResp = await fetch('/vapid-public-key');
        if (!keyResp.ok) throw new Error('Could not fetch server key.');
        const { publicKey } = await keyResp.json();

        // Request notification permission
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          throw new Error('Notification permission denied. Please allow notifications and try again.');
        }

        // Subscribe to push
        const subscription = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(publicKey),
        });

        // Send subscription to server
        const sub = subscription.toJSON();
        const resp = await fetch('/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            endpoint: sub.endpoint,
            p256dh: sub.keys.p256dh,
            auth: sub.keys.auth,
            label,
          }),
        });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.error || 'Failed to save subscription.');
        }

        statusEl.textContent = '✓ You\'re subscribed! You\'ll receive plant notifications on this device.';
        statusEl.className = 'success';
        document.getElementById('subscribeForm').style.display = 'none';
        renderPlantDashboard();

      } catch (err) {
        statusEl.textContent = err.message;
        statusEl.className = 'error';
        btn.disabled = false;
        btn.textContent = 'Enable Notifications';
      }
    }

    function urlBase64ToUint8Array(base64) {
      const padding = '='.repeat((4 - base64.length % 4) % 4);
      const b64 = (base64 + padding).replace(/-/g, '+').replace(/_/g, '/');
      const raw = atob(b64);
      return Uint8Array.from(raw, c => c.charCodeAt(0));
    }
  </script>
</body>
</html>
